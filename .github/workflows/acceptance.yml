name: acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  fixtures:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of the supported range. SETUP.md claims
        # 3.8+; this is what makes that claim a checked one.
        python-version: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: fixture regression test
        run: python tests/test_fixtures.py
      - name: self-audit must not FAIL
        run: |
          code=0
          python skill_audit.py . || code=$?
          if [ "$code" -eq 1 ] || [ "$code" -eq 3 ]; then
            echo "self-audit returned $code — the skill fails its own floor."
            exit 1
          fi
          echo "self-audit exit $code — acceptable (0 PASS or 2 REVIEW)."

  windows-legacy-console:
    # D48. A literal U+2192 in a print path raised UnicodeEncodeError on a
    # cp1252 console and killed the run before any verdict was emitted — on
    # the free lead magnet, on the most common consumer platform, with no
    # Linux symptom at all. Actions hands us a UTF-8 console, so the legacy
    # code page is forced explicitly; without that this leg passes for the
    # wrong reason. One Python version is enough: this is an encoding leg,
    # not a compatibility matrix — the range is covered above.
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: cp1252
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: fixture regression test
        run: python tests/test_fixtures.py
      - name: report must render on a legacy code page
        shell: bash
        run: |
          # examples/before is the deliberately-bad fixture: it FAILs, so the
          # per-finding fix lines print. Those are the lines that crashed.
          code=0
          python skill_audit.py examples/before > out.txt 2> err.txt || code=$?
          cat out.txt
          if grep -qE 'UnicodeEncodeError|Traceback' err.txt; then
            echo "D48 regression: the report is not renderable on a cp1252 console."
            cat err.txt
            exit 1
          fi
          if ! grep -q 'VERDICT' out.txt; then
            echo "no verdict emitted under cp1252 (checker exit $code)."
            exit 1
          fi
          echo "renders clean under cp1252; checker exit $code (1 = the fixture's own FAIL verdict)."
